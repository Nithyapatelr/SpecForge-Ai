version: "3.9"

services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env

  metagpt:
    build:
      context: .
      dockerfile: Dockerfile.metagpt
    volumes:
      - ./data/metagpt_workspace:/app/MetaGPT/workspace
    env_file:
      - .env

  chatdev:
    build:
      context: .
      dockerfile: Dockerfile.chatdev
    volumes:
      - ./data/chatdev_workspace:/app/ChatDev/WareHouse
    env_file:
      - .env

